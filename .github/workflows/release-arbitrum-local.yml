# Build and publish an Arbitrum Blockscout image for the crynux-network fork.
# Uses docker/Dockerfile.local so the evision precompiled tarball is seeded with
# curl before Mix compile. Official release workflows cannot be reused as-is:
# they push to ghcr.io/blockscout, use the org `build` runner, and need ARM hosts.
name: Release Arbitrum (local fork)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version. Must match mix.exs version. Leave empty for 11.3.1.
        required: false
        type: string
        default: "11.3.1"

permissions:
  contents: read
  packages: write

env:
  RELEASE_VERSION: ${{ inputs.release_version || '11.3.1' }}
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/blockscout-arbitrum

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Add SHORT_SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push Docker image (indexer + API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.local
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}-commit.${{ env.SHORT_SHA }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            BLOCKSCOUT_VERSION=v${{ env.RELEASE_VERSION }}.+commit.${{ env.SHORT_SHA }}
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
            CHAIN_TYPE=arbitrum
